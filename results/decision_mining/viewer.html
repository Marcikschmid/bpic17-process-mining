function focusDecision(id){const g=decisions.find(g=>g.id===id);const e=modeler.get('elementRegistry').get(g.bpmn_id);const note=modeler.get('elementRegistry').get('note_'+id);const left=Math.min(e.x,note.x)-80;const top=Math.min(e.y,note.y)-80;modeler.get('canvas').viewbox({x:left,y:top,width:Math.max(900,Math.max(e.x+e.width,note.x+note.width)-left+80),height:Math.max(650,Math.max(e.y+e.height,note.y+note.height)-top+160)});jump.value=id;let text=g.id+' · Gelernter Entscheidungsblock\n\nTest-Accuracy '+g.accuracy.toFixed(3)+'; Mehrheit '+g.majority_accuracy.toFixed(3)+'; Macro-F1 '+g.macro_f1.toFixed(3)+'\n\nStatistische Regeln. Harte Guards: 13,28 % vollständige Testfallabdeckung.\n\n';for(const leaf of g.leaves){text+=g.branches[leaf.class]+': '+(leaf.predicates.map(humanPredicate).join(' UND ')||'immer')+'\nTraining n='+leaf.samples+'\n\n';}text+='Fehlend: numerisch -1; *_known zeigt bekannte Werte. Für den formalen Ausdruck einen Pfeil anklicken.';document.getElementById('details').textContent=text;}
jump.onchange=()=>focusDecision(jump.value);
modeler.on('element.click',e=>{const b=e.element.businessObject;const docs=(b.documentation||[]).map(x=>x.text).join('\n');document.getElementById('details').textContent=(b.name||b.id)+'\n\n'+docs+'\n\n'+(b.conditionExpression?b.conditionExpression.body:'');});
fetch('decision_model.bpmn').then(r=>r.text()).then(async xml=>{const r=await modeler.importXML(xml);focusDecision("D01");document.getElementById('state').textContent='Geladen · '+r.warnings.length+' Hinweise';window.bpmnReady=true;window.bpmnWarnings=r.warnings.map(x=>x.message);}).catch(e=>document.getElementById('state').textContent=e.message);
</script>
